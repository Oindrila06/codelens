[project]
name = "codelens"
version = "0.1.0"
description = "Context-aware, security-focused AI code review GitHub App"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyjwt[crypto]>=2.8",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "tree-sitter>=0.22",
  "tree-sitter-python>=0.21",
  "rq>=1.16",
  "redis>=5.0",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "ruff>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embeddings = ["sentence-transformers>=2.7"]
semgrep = ["semgrep>=1.70"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codelens*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
